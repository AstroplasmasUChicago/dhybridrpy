[project]
name = "dhybridrpy"
version = "v1.8"
description = "A Python package to easily read input + output data from dHybridR."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "h5py",
    "matplotlib",
    "numpy",
    "ruff",
    "h5py",
    "f90nml",
    "pre-commit",
    "dask",
    "typer>=0.20.1",
    "joblib>=1.4.2",
]
license = {file = "LICENSE.txt"}

[project.urls]
Homepage = "https://github.com/AstroplasmasUChicago/dhybridrpy"

[project.scripts]
dplot = "dhybridrpy.__main__:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
