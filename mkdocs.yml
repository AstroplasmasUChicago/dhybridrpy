site_name: dhybridrpy
site_description: Read and plot dHybridR simulation output in Python.
site_author: Bricker Ostler, Miha Cernetic
site_url: https://dhybridrpy.readthedocs.io/

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

repo_name: AstroplasmasUChicago/dhybridrpy
repo_url: https://github.com/AstroplasmasUChicago/dhybridrpy

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
  - User Guide:
    - Working with Data: user-guide/working-with-data.md
    - Particle Tracks: user-guide/particle-tracks.md
    - Plotting: user-guide/plotting.md
    - Lazy Loading: user-guide/lazy-loading.md
    - CLI Tool (dplot): user-guide/dplot.md
  - API Reference:
    - DHybridrpy: api/dhybridrpy.md
    - Timestep: api/timestep.md
    - Data Classes: api/data.md
    - Tracks: api/tracks.md
  - Examples:
    - Overview: examples.md
    - Magnetic magnitude and profile: examples/magnetic-field.md
    - Field history: examples/time-history.md
    - Power spectra: examples/spectra.md

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js
  - js/banner.js

extra_css:
  - css/banner.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AstroplasmasUChicago/dhybridrpy
